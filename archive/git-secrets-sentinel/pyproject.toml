[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-secrets-sentinel"
version = "0.1.0"
description = "Lightweight staged-file secret detection for Git workflows"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
git-secrets-sentinel = "sentinel:main"

[tool.setuptools]
py-modules = ["sentinel"]
