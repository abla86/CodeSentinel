name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Production smoke test
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high
