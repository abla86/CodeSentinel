name: GitHub App Check

on:
  push:
    paths:
      - "github-app/**"
      - ".github/workflows/github-app-check.yml"
  pull_request:
    paths:
      - "github-app/**"
      - ".github/workflows/github-app-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: github-app/package.json
      - run: npm install
      - run: npm run github-app:check
