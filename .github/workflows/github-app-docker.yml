name: GitHub App Docker Build

on:
  push:
    paths:
      - "github-app/**"
      - ".github/workflows/github-app-docker.yml"
  pull_request:
    paths:
      - "github-app/**"
      - ".github/workflows/github-app-docker.yml"

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GitHub App image
        run: docker build -t codesentinel-github-app:test github-app
      - name: Verify image metadata
        run: docker image inspect codesentinel-github-app:test >/dev/null
